services:
  # Production-style build, served by nginx. Self-contained (mocks baked
  # in) — just `docker compose up web`.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_MOCKS: "true"
    ports:
      - "8080:8080"
    environment:
      # Only used once a real backend exists — see docs/web-api-gaps.md.
      # Irrelevant while VITE_ENABLE_MOCKS=true, since MSW answers every
      # request before it reaches the network.
      DEVMATE_API_PROXY_TARGET: http://backend:8000
    restart: unless-stopped

  # Hot-reload dev server for contributors who prefer a containerized
  # toolchain. Opt-in: `docker compose --profile dev up dev`.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      VITE_ENABLE_MOCKS: "true"
    volumes:
      - .:/app
      - devmate_node_modules:/app/node_modules
    profiles:
      - dev

volumes:
  devmate_node_modules:
