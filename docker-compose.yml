services:
  # Production-style build, served by nginx. Self-contained (mocks baked
  # in) — just `docker compose up web`.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_MOCKS: "true"
    ports:
      - "8080:8080"
    environment:
      # Only used once a real backend exists — see docs/web-api-gaps.md.
      # Irrelevant while VITE_ENABLE_MOCKS=true, since MSW answers every
      # request before it reaches the network.
      DEVMATE_API_PROXY_TARGET: http://backend:8000
    networks:
      - devmate-net
    restart: unless-stopped

  # Hot-reload dev server for contributors who prefer a containerized
  # toolchain. Opt-in: `docker compose --profile dev up dev`.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      # ${VAR:-default} so `VITE_ENABLE_MOCKS=false docker compose ... up dev`
      # from the host shell actually overrides this — a literal "true" here
      # would always win over the shell env var.
      VITE_ENABLE_MOCKS: ${VITE_ENABLE_MOCKS:-true}
      # Read by vite.config.ts's dev-server proxy (Node-side, not inlined at
      # build time like VITE_ vars). Only reached once VITE_ENABLE_MOCKS=false
      # — until then MSW answers every request first. Same target as `web`.
      DEVMATE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - .:/app
      - devmate_node_modules:/app/node_modules
    networks:
      - devmate-net
    profiles:
      - dev

volumes:
  devmate_node_modules:

networks:
  # Fixed name (no `external: true`), shared with the DevMate backend's own
  # compose (sibling repo, e.g. ../Cortana) so `http://backend:8000`
  # resolves. Compose creates this network on whichever project's `up` runs
  # first; the other project just attaches to it — no manual
  # `docker network create` step, no start-order requirement. Harmless to
  # keep attached while VITE_ENABLE_MOCKS=true, since MSW never reaches the
  # network, and `docker compose up web` alone still works standalone
  # (Compose creates the network even with nothing on the other side).
  devmate-net:
    name: devmate-net
